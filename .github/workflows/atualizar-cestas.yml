name: Atualizar cestas por entidade

# Roda todo dia 7 (e de novo nos dias 10 e 15, caso a API ainda não tenha publicado o mês novo:
# se já estiver atualizado, termina em segundos sem consultar nada).
# Também roda quando a planilha em dados-fonte/ é trocada, e pode ser disparado manualmente
# em Actions → "Atualizar cestas por entidade" → Run workflow.
on:
  schedule:
    - cron: '17 9 7,10,15 * *'   # 06:17 em Brasília
  push:
    branches: [main]
    paths: ['dados-fonte/**']
  workflow_dispatch:
    inputs:
      force:
        description: 'Atualizar mesmo sem mês novo na API'
        type: boolean
        default: false
      only:
        description: 'Somente estas entidades (ex.: IABR,ABAL). Vazio = todas'
        required: false
        default: ''

concurrency:
  group: atualizar-cestas
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Gerar dicionário (se houver planilha em dados-fonte/)
        run: node scripts/build-dicionario.mjs
      - name: Consultar a API Comex Stat (devagar)
        id: dados
        env:
          FORCE: ${{ github.event_name == 'push' && '1' || inputs.force && '1' || '0' }}
          ONLY: ${{ inputs.only }}
        run: node scripts/update-cestas.mjs
      - name: Calcular o radar de alertas
        if: steps.dados.outputs.atualizado == 'true'
        run: npx tsx scripts/gerar-alertas.ts resumo-alertas.md
      - name: Salvar no repositório (o Netlify publica sozinho)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cestas
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Atualiza dados das cestas por entidade"
          git pull --rebase origin ${{ github.ref_name }}
          git push
      - name: Enviar resumo dos alertas por e-mail (aviso no GitHub)
        if: steps.dados.outputs.atualizado == 'true' && vars.ALERTAS_EMAIL != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Radar de alertas das cestas — dados até ${{ steps.dados.outputs.periodo }}" --body-file resumo-alertas.md
